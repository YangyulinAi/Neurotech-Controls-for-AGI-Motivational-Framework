# LSL API Configuration for SERVER (receiving X.on data)  
# Place this file at: ~/lsl_api/lsl_api.cfg or /etc/lsl_api/lsl_api.cfg
# Replace <YOUR_HOME_PUBLIC_IP> with your home's public IP address

[ports]
MulticastPort = 3051
BasePort      = 3052
PortRange     = 16

[lab]
KnownPeers = {<YOUR_HOME_PUBLIC_IP>}
SessionID  = xon-bridge