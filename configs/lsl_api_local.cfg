# LSL API Configuration for LOCAL computer (with X.on device)
# Place this file at: ~/lsl_api/lsl_api.cfg or C:\etc\lsl_api\lsl_api.cfg
# Replace <SERVER_PUBLIC_IP> with your cloud server's public IP address

[ports]
MulticastPort = 3051
BasePort      = 3052
PortRange     = 16     ; => 3052–3067

[lab]
KnownPeers = {<SERVER_PUBLIC_IP>}
SessionID  = xon-bridge